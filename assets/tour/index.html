<style>
/* Layout: full-bleed 3D stage; floating glass controls on top (brand + mode switch), product rail at the bottom, detail card on the right (bottom sheet when narrow). Single dark look to match Fast Pitch. */
:root{
  --bg:#030404; --glass:rgba(16,22,22,.78); --glass-2:rgba(255,255,255,.07); --line:rgba(255,255,255,.12);
  --fg:#f3f5f4; --muted:#9aa6a3; --mint:#1bfba5; --vg:#05E5AF; --ink:#0b1412;
  --f-display:"Vivint Sans",-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --f-body:"Vivint Sans",-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.75,.2,1);
  color-scheme:dark;
}
@font-face{font-family:"Vivint Sans";src:url(../fonts/VivintSans-Light.woff) format("woff");font-weight:300;font-display:swap}
@font-face{font-family:"Vivint Sans";src:url(../fonts/VivintSans-Regular.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Vivint Sans";src:url(../fonts/VivintSans-Medium.woff) format("woff");font-weight:500 600;font-display:swap}
@font-face{font-family:"Vivint Sans";src:url(../fonts/VivintSans-Bold.woff) format("woff");font-weight:700 900;font-display:swap}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;position:fixed;inset:0;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}

/* top bar */
#top{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.lead{display:flex;align-items:center;gap:14px;min-width:0}
#brand .eb{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mint)}
#brand h1{margin:4px 0 0;font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
#brand p{margin:6px 0 0;font-size:14px;color:var(--muted);max-width:34ch}
#back{display:flex;align-items:center;gap:8px;height:48px;padding:0 18px 0 12px;border-radius:24px;font-weight:600;font-size:16px}
#back svg{width:22px;height:22px}
#seg{display:flex;padding:4px;border-radius:26px;gap:2px}
#seg button{height:42px;padding:0 20px;border-radius:21px;font-weight:600;font-size:15px;color:var(--muted);transition:background .25s,color .25s}
#seg button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}

/* hotspots */
#spots{position:fixed;inset:0;pointer-events:none;z-index:3}
.hs{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;pointer-events:auto;will-change:transform}
.hs .dot{position:absolute;inset:4px;border-radius:50%;background:rgba(10,16,16,.38);border:1.5px solid rgba(255,255,255,.9);box-shadow:0 0 18px rgba(27,251,165,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hs .dot::before{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint)}
.hs .dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--mint);opacity:0;animation:pulse 2.4s var(--ease) infinite}
.hs .lbl{position:absolute;top:50%;left:44px;transform:translateY(-50%);white-space:nowrap;padding:7px 10px;border-radius:7px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;line-height:1.25;
  background:rgba(22,24,24,.82);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hs.l .lbl{left:auto;right:44px}
.hs.mini{transform-origin:center}
.hs.mini .dot{inset:10px;opacity:.85}
.hs.mini .dot::after{display:none}
.hs.mini .lbl,.hs.nolbl .lbl{display:none}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}80%,100%{transform:scale(1.5);opacity:0}}

/* bottom rail */
#rail{position:fixed;left:0;right:0;bottom:0;z-index:6;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;pointer-events:none}
#railIn{display:flex;gap:6px;padding:6px;border-radius:22px;max-width:100%;overflow-x:auto;scrollbar-width:none;pointer-events:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x}
#railIn::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;width:86px;height:84px;padding:6px 4px 8px;border-radius:16px;transition:background .25s}
.chip img{height:40px;width:56px;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.chip span{font-size:11px;font-weight:600;line-height:1.15;text-align:center;color:var(--muted);text-wrap:balance}
.chip[aria-current="true"]{background:var(--glass-2);box-shadow:inset 0 0 0 1.5px var(--mint)}
.chip[aria-current="true"] span{color:var(--fg)}

/* detail card */
#card{position:fixed;z-index:7;right:max(18px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 86px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 126px);width:min(360px,38vw);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(0);opacity:1;transition:transform .45s var(--ease),opacity .35s}
#card.away{transform:translateX(30px);opacity:0;pointer-events:none}
.c-media{position:relative;height:170px;flex:0 0 auto;display:grid;place-items:center;background:radial-gradient(70% 80% at 50% 60%,rgba(27,251,165,.14),transparent 70%)}
.c-media img{max-height:140px;max-width:78%;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
.c-body{padding:4px 22px 0;overflow-y:auto;flex:1 1 auto;min-height:0;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.c-where{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mint)}
.c-name{margin:6px 0 14px;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.08;text-wrap:balance}
.feat{padding:12px 0;border-top:1px solid var(--line)}
.feat b{display:block;font-size:15px;font-weight:600;margin-bottom:4px}
.feat p{margin:0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.c-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-top:1px solid var(--line);flex:0 0 auto}
.c-nav button{display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;font-weight:600;font-size:14px;background:var(--glass-2)}
.c-nav button svg{width:18px;height:18px}
.c-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
#next{flex-direction:column;align-items:flex-end;gap:1px;height:auto;padding:8px 14px;background:none}
#next small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
#next b{display:flex;align-items:center;gap:4px;font-size:13.5px;letter-spacing:.04em;text-transform:uppercase}
#prev{width:44px;padding:0;justify-content:center}

/* hint + loading */
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 124px);transform:translateX(-50%);z-index:4;padding:9px 16px;border-radius:18px;font-size:13px;font-weight:500;color:var(--fg);white-space:nowrap;transition:opacity .5s}
#hint.gone{opacity:0}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:9;background:var(--bg);transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
#loading{place-content:center;gap:16px}
#loading div{font-size:15px;color:var(--muted);letter-spacing:.02em}
#loadBar{display:block;width:180px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--mint) var(--p,0%),rgba(255,255,255,.12) 0);transition:--p .3s}

/* narrow / portrait phone: card becomes a bottom sheet */
/* soft shade behind the title so it stays readable over a bright sky */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 150px);background:none;pointer-events:none;z-index:2}
body.focus::before{opacity:0}
body.focus #brand{display:none}
#brand h1,#brand p,#brand .eb{text-shadow:0 1px 12px rgba(0,0,0,.55)}
@media (max-width:760px), (max-aspect-ratio:1/1){
  #brand h1{font-size:22px}
  #brand p{display:none}
  #card{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);height:min(44vh,400px)}
  #card.away{transform:translateY(30px)}
  .c-media{height:96px}
  .c-media img{max-height:80px}
  .c-name{font-size:21px;margin-bottom:8px}
  .chip{width:74px;height:76px}
  #hint{bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}
  body.focus #hint{display:none}
  #seg button{padding:0 14px}
}
@media (prefers-reduced-motion:reduce){ .hs .dot::after{animation:none} #card{transition:none} }
</style>

function canvasTex(w, h, draw, size, color=true){
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1/size[0], 1/size[1]);
  t.anisotropy = Math.min(8, maxAniso); if(color) t.colorSpace = THREE.SRGBColorSpace; return t;
}

const lapDraw = (base, dark) => (g,w,h) => { const bh = h/LAP;
  for(let i=0;i<LAP;i++){ const y=i*bh, gr=g.createLinearGradient(0,y,0,y+bh);
    gr.addColorStop(0,base[0]); gr.addColorStop(.86,base[1]); gr.addColorStop(.93,dark); gr.addColorStop(1,dark); g.fillStyle=gr; g.fillRect(0,y,w,bh); }
  for(let i=0;i<2600;i++){ g.fillStyle=`rgba(0,0,0,${rnd()*.035})`; g.fillRect(rnd()*w,rnd()*h,1+rnd()*3,1); } };

/* planar UVs in world metres (x,-z on top faces; along-wall,y on sides) */
function worldUV(g, ox=0, oy=0, oz=0){
  const p=g.attributes.position, n=g.attributes.normal, uv=g.attributes.uv;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i)+ox, y=p.getY(i)+oy, z=p.getZ(i)+oz, nx=n.getX(i), ny=n.getY(i), nz=n.getZ(i), ax=Math.abs(nx), ay=Math.abs(ny), az=Math.abs(nz);
    if(ay>=ax && ay>=az) uv.setXY(i, x, -z);
    else if(ax>=az) uv.setXY(i, nx>0 ? -z : z, y);
    else uv.setXY(i, nz>0 ? x : -x, y);
  }
  uv.needsUpdate = true; return g;
}
function slab(x1,x2,y1,y2,z1,z2,m,parent,shadow=true){

  worldUV(g, (x1+x2)/2,(y1+y2)/2,(z1+z2)/2);
  const mesh = new THREE.Mesh(g, m);
  mesh.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);
  mesh.castShadow = shadow; mesh.receiveShadow = true;
  (parent||scene).add(mesh); return mesh;
}

/* A wall along X (fixed z=at) or along Z (fixed x=at). Openings {a,b,lo,hi,kind:'window'|'door'|'none', lit} */
function wall({axis, at, from, to, h, y0=FL, t=0.2, open=[], m=M.siding, inner=null}){
  const grp = new THREE.Group(); scene.add(grp);
  const seg = (a,b,lo,hi,mm=m,th=t,off=0) => axis==='x'
    ? slab(a,b,y0+lo,y0+hi,at-th/2+off,at+th/2+off,mm,grp)
    : slab(at-th/2+off,at+th/2+off,y0+lo,y0+hi,a,b,mm,grp);
  // split the wall into columns at every opening edge; each column is solid except where an opening covers it
  const xs = [...new Set([from, to, ...open.flatMap(o=>[o.a,o.b])])].filter(x=>x>=from&&x<=to).sort((p,q)=>p-q);
  for(let i=0;i<xs.length-1;i++){
    const x0 = xs[i], x1 = xs[i+1]; if(x1-x0 < 1e-4) continue;
    const holes = open.filter(o=>o.a<=x0+1e-6 && o.b>=x1-1e-6).map(o=>[o.lo,o.hi]).sort((p,q)=>p[0]-q[0]);
    let y = 0;
    for(const [lo,hi] of holes){ if(lo>y) seg(x0,x1,y,lo); y = Math.max(y,hi); }
    if(y<h) seg(x0,x1,y,h);
  }
  for(const o of open){
    if(o.kind==='window'){
      const fw=.06, fd=t+.06;
      seg(o.a,o.a+fw,o.lo,o.hi,M.trim,fd); seg(o.b-fw,o.b,o.lo,o.hi,M.trim,fd);
      seg(o.a,o.b,o.lo,o.lo+fw,M.trim,fd); seg(o.a,o.b,o.hi-fw,o.hi,M.trim,fd);
      if(o.mull) for(const k of o.mull){ const mx=o.a+(o.b-o.a)*k; seg(mx-.025,mx+.025,o.lo,o.hi,M.trim,fd*.7); }
      seg(o.a+fw,o.b-fw,o.lo+fw,o.hi-fw,o.lit?M.glassLit:M.glassDark,.03);
      seg(o.a-.04,o.b+.04,o.lo-.05,o.lo,M.trim,t+.12);   // sill
    }
  }
  return grp;
}

      const gg=new THREE.ExtrudeGeometry(sh,{depth:.0008,bevelEnabled:true,bevelThickness:.00015,bevelSize:.00015,bevelSegments:3,curveSegments:24});
      add(g, new THREE.Mesh(gg,hubGlass),0,0,.02165).userData.noRS = true; }
    // live home screen under the glass (the home key on the fabric comes from the CAD)
    add(g, new THREE.Mesh(new THREE.PlaneGeometry(.1513,.0915), (()=>{ const t = HUB ? hubTex('hubscr') : DEC.hub; return new THREE.MeshStandardMaterial({map:t, emissiveMap:t, emissive:0xffffff, emissiveIntensity:.75, color:0x222222, roughness:.15, polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2}); })()),-.0032,.01555,.02262);
    add(g, faceZ(cyl(.0013,.0004,PM.lens,24)),0,.0705,.0228);   // camera pinhole above the screen
    return g; },
  therm(){ const g=G();                                 // Smart Thermostat: white face with soft glowing set point
    add(g, rslab(.1,.1,.024,.022,.009,PM.white),0,0,.012);
    add(g, decal(DEC.therm,.074,.074,{r:.4, x:{emissiveMap:DEC.therm, emissive:0xffffff, emissiveIntensity:.25}}),0,0,.0242);
    return g; },
  icp(){ const g=G();                                   // Indoor Camera Pro: round base, loop arm, square glossy head (origin at base)
    add(g, cyl(.043,.01,PM.blackM,64),0,.005,0);
    const rim = add(g, torus(.043,.005,PM.blackM),0,.005,0); rim.rotation.x = Math.PI/2;
    add(g, rbox(.03,.018,.026,.006,PM.blackM),0,.019,-.006);
    add(g, rring(.05,.07,.014,.007,.006,PM.blackM),0,.062,-.012);
    add(g, rslab(.078,.078,.06,.018,.01,PM.gloss),0,.118,0);
    add(g, faceZ(cyl(.022,.003,PM.bezel,64)),0,.122,.0305);
    add(g, lens(.012),0,.122,.032);
    for(const x of [-.028,.028]) add(g, faceZ(cyl(.0014,.001,PM.dot,16)),x,.148,.0302);
    add(g, decal(DEC.logo,.022,.0055),0,.089,.0303);
    return g; },
  window(){ const g=G();                                // Door & Window Sensor: magnet and sensor, both pill shaped
    add(g, rslab(.034,.112,.019,.017,.006,PM.whiteM),0,0,.0095);
    add(g, rslab(.02,.068,.016,.01,.005,PM.whiteM),.036,-.008,.008);
    return g; },
  motion(){ const g=G();                                // Motion Sensor: pillow body, fresnel lens window
    add(g, rslab(.085,.095,.045,.02,.013,PM.whiteM),0,0,.0225);
    add(g, rslab(.066,.05,.006,.011,.003,PM.frost),0,.014,.044);
    add(g, decal(DEC.logo,.03,.0075,{color:0xd4d6d5, r:.7, op:.8}),0,-.03,.0452);
    return g; },
  smokeco(){ const g=G();                               // Smoke & CO Detector: domed puck, radial fins, printed ring text
    const prof = [[0,0],[.064,0],[.066,.004],[.066,.02],[.062,.028],[.05,.034],[.03,.037],[.0001,.038]].map(([r,h])=>new THREE.Vector2(r,h));
    const lg = new THREE.LatheGeometry(prof, 96);
    const p = lg.attributes.position, uv = new Float32Array(p.count*2);
    for(let i=0;i<p.count;i++){ uv[2*i] = p.getX(i)/.132+.5; uv[2*i+1] = -p.getZ(i)/.132+.5; }
    lg.setAttribute('uv', new THREE.BufferAttribute(uv,2));
    const body = add(g, new THREE.Mesh(lg, PM.whiteM)); body.rotation.x = Math.PI/2;
    const txt = add(g, new THREE.Mesh(lg, new THREE.MeshStandardMaterial({map:DEC.smoke, transparent:true, depthWrite:false, roughness:.6, polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2}))); txt.rotation.x = Math.PI/2;
    for(let i=0;i<8;i++){ const a=i*Math.PI/4+Math.PI/8; const f = add(g, rbox(.03,.006,.007,.0025,PM.whiteM),Math.cos(a)*.036,Math.sin(a)*.036,.0365); f.rotation.z = a; }
    add(g, torus(.021,.0022,PM.whiteM),0,0,.0372);
    add(g, dome(.019,.006,PM.whiteM),0,0,.037);
    for(const x of [-.024,-.012]) add(g, rslab(.01,.007,.003,.002,.001,mat(0x6d7172,{r:.4})),x,.046,.0315);
    add(g, new THREE.Mesh(new THREE.SphereGeometry(.0022,18,12),PM.green),0,-.052,.03);
    return g; },
  water(){ const g=G();                                 // Water Sensor: soft square puck with probes (origin at base, +y up)
    add(g, rbox(.075,.022,.075,.0105,PM.whiteM),0,.012,0);
    const l = add(g, decal(DEC.logo,.028,.007,{color:0xd6d8d7, r:.7, op:.8}),0,.0231,.012); l.rotation.x = -Math.PI/2;
    for(const [x,z] of [[-.027,-.027],[.027,-.027],[-.027,.027],[.027,.027]]) add(g, new THREE.Mesh(new THREE.SphereGeometry(.004,18,12),PM.silver),x,.0015,z);
    return g; },
};
/* soft fill light that follows the camera to the focused product, like a photographer's key light */
const prodLight = new THREE.SpotLight(0xffffff, 0, 3.2, .42, .85, 1.2);
scene.add(prodLight, prodLight.target);

/* where each product lives: position, the direction the camera views it from, and how it mounts */


/* ------------------------------------------------------------------ product placement */
const PLACE = {
  ocspot:{pos:V(-9.35,2.72,4.02),  view:V(0,0,1),            d:1.1},
  window:{pos:V(-2.85,FL+2.38,4.06), view:V(0,0,1),          d:.66},
  lock:  {pos:V(-1.12,FL+1.05,3.915), view:V(0,0,1),         d:.72},
  dbcp:  {pos:V(-0.58,FL+1.3,4.02),  view:V(0,0,1),          d:.72},
  hub:   {pos:V(1.62,FL+1.5,-1.25),  view:V(1,0,0),          d:1.1},
  motion:{pos:V(1.72,FL+2.75,-5.68), view:V(.62,-.32,.62),   d:.72},
  smokeco:{pos:V(4.0,FL+5.3,-5.79),  view:V(0,0,1),          d:.8},
  water: {pos:V(5.15,FL+.012,-5.02), view:V(.05,.78,.62), flat:true, d:.62},
  icp:   {pos:V(9.52,FL+1.05,-2.55), view:V(-1,0,.45), stand:true, d:.72},
  therm: {pos:V(9.79,FL+1.5,0.55),   view:V(-1,0,0),         d:.66},
  ocp:   {pos:V(10.75,3.6,1.02),     view:V(.25,0,1),        d:.95},
};
/* boxes the hotspot rings can hide behind (solid parts of the house) */
const OCC = [
  [-10.2,-5.0, 0,3.3, -6,4.0],    // garage
  [-5.2, 1.6, 0,6.5, -6,4.0],     // main volume
  [ 1.4,10.1, 6.4,9, -6.6,4.6],   // roof
  [10.0,11.5, 0,7.2, -6.2,1.0],   // tower
  [ 1.4,10.1, 0,6.5, -6.2,-5.8],  // back wall
  [ 9.8,10.1, 0,6.5, -6,4.0],     // right wall
  [ 1.4, 1.6, 0,6.5, -6,4.0],     // shared wall
].map(a => new THREE.Box3(V(a[0],a[2],a[4]), V(a[1],a[3],a[5])));
const S = 1.45; // models are drawn a touch larger than life so they read on an iPad
const raycaster = new THREE.Raycaster();
const hitMeshes = [];
for(const p of PRODUCTS){
  const pl = PLACE[p.k]; Object.assign(p, pl); p.view.normalize();
  const g = MODELS[p.k](); g.scale.setScalar(S);
  g.position.copy(p.pos);
  if(p.flat || p.stand) g.rotation.y = Math.atan2(p.view.x, p.view.z);
  else g.lookAt(p.pos.clone().add(p.view));
  g.traverse(o=>{ if(o.isMesh){ o.castShadow=false; o.receiveShadow=!o.userData.noRS; } });
  scene.add(g); g.updateMatrixWorld(true);
  p.model = g;
  p.center = new THREE.Box3().setFromObject(g).getCenter(new THREE.Vector3());
  p.anchor = p.center.clone().addScaledVector(p.view, .12);
  const hit = new THREE.Mesh(new THREE.SphereGeometry(.22,12,8), new THREE.MeshBasicMaterial({visible:false}));
  hit.position.copy(p.center); hit.userData.p = p; scene.add(hit); hitMeshes.push(hit);
  p.feats = FEATS[p.k] || [];
}
const byKey = Object.fromEntries(PRODUCTS.map(p=>[p.k,p]));

/* ------------------------------------------------------------------ camera rig */
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .085;
controls.enablePan = false; controls.rotateSpeed = .7; controls.zoomSpeed = .9;
controls.touches = {ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN};

/* one diorama view: front-right three-quarter, like an architectural cutaway */
const HOME = {target:V(0.0,2.3,1.2), r:27.5, phi:1.36, theta:.17, lim:{minD:11, maxD:40, minP:.72, maxP:1.5, minA:-.95, maxA:1.05}};
const state = { focus:null, fly:null, idleAt:performance.now() };

function applyLimits(l){
  controls.minDistance=l.minD; controls.maxDistance=l.maxD;
  controls.minPolarAngle=l.minP; controls.maxPolarAngle=l.maxP;
  controls.minAzimuthAngle = l.minA ?? -Infinity; controls.maxAzimuthAngle = l.maxA ?? Infinity;
}
function openLimits(){ applyLimits({minD:0, maxD:Infinity, minP:0, maxP:Math.PI}); }
const wrap = a => { while(a>Math.PI) a-=2*Math.PI; while(a<-Math.PI) a+=2*Math.PI; return a; };
function poseFor(view, theta){ const s=new THREE.Spherical(view.r, view.phi, theta ?? view.theta); return {pos:view.target.clone().add(new THREE.Vector3().setFromSpherical(s)), target:view.target.clone()}; }
const sheetMQ = matchMedia('(max-width:760px), (max-aspect-ratio:1/1)');
function focusPose(p){
  const s = new THREE.Spherical().setFromVector3(p.view);
  const base = {phi:s.phi, theta:s.theta};
  s.radius = p.d * (sheetMQ.matches ? 1.3 : 1); s.phi = THREE.MathUtils.clamp(s.phi-.16, .25, 1.75); if(!p.flat) s.theta += .3;
  const pos = p.center.clone().add(new THREE.Vector3().setFromSpherical(s));
  const lim = {minD:p.d*.45, maxD:p.d*2.6, minP:Math.max(.12, base.phi-1.05), maxP:Math.min(p.flat?1.35:2.25, base.phi+.95)};
  if(!p.flat){ lim.minA = wrap(base.theta-1.2); lim.maxA = wrap(base.theta+1.2); }
  return {pos, target:p.center.clone(), lim};
}
const easeIO = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function flyTo(pose, {dur=1.4, lim, done}={}){
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  const s0 = new THREE.Spherical().setFromVector3(p0.clone().sub(t0));
  const s1 = new THREE.Spherical().setFromVector3(pose.pos.clone().sub(pose.target));
  const sep = t0.distanceTo(pose.target);
  const r0 = Math.log(s0.radius), r1 = Math.log(s1.radius);
  const rMid = Math.log(Math.max(s0.radius, s1.radius, sep*1.1 + (sep>1 ? 2.5 : 0)));
  const bump = Math.max(0, rMid - (r0+r1)/2);
  state.fly = {t0, t1:pose.target.clone(), s0, s1, r0, r1, bump, dTheta:wrap(s1.theta-s0.theta), start:performance.now(), dur:(reduceMotion?.35:dur)*1000, lim, done};
  controls.enabled = false; controls.autoRotate = false; openLimits();
}
function stepFly(now){
  const f = state.fly; if(!f) return;
  const k = Math.min(1,(now-f.start)/f.dur), e = easeIO(k);
  controls.target.lerpVectors(f.t0, f.t1, e);
  const r = Math.exp(f.r0 + (f.r1-f.r0)*e + f.bump*Math.sin(Math.PI*e));
  const s = new THREE.Spherical(r, f.s0.phi + (f.s1.phi-f.s0.phi)*e, f.s0.theta + f.dTheta*e);
  camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(s));
  camera.lookAt(controls.target);
  if(k>=1){ state.fly=null; if(f.lim) applyLimits(f.lim); controls.enabled=true; controls.update(); f.done && f.done(); }
}

/* ------------------------------------------------------------------ UI */
const $ = s => document.querySelector(s);
const spotsEl = $('#spots'), railIn = $('#railIn'), card = $('#card'), hint = $('#hint');
for(const p of PRODUCTS){
  const b = document.createElement('button');
  b.className = 'hs ' + p.side; b.hidden = true; b.setAttribute('aria-label', p.name);
  b.innerHTML = `<span class="dot"></span><span class="lbl">${p.name}</span>`;
  b.addEventListener('click', e => { e.stopPropagation(); focus(p); });
  spotsEl.appendChild(b); p.el = b;
  const c = document.createElement('button');
  c.className = 'chip'; c.dataset.k = p.k; c.setAttribute('aria-current','false');
  c.innerHTML = `<img src="../cat/${p.img}.webp?v=176" alt=""><span>${p.name}</span>`;
  c.addEventListener('click', () => focus(p));
  railIn.appendChild(c); p.chip = c;
}
function setHint(t){ hint.textContent = t; hint.classList.remove('gone'); clearTimeout(setHint.t); setHint.t = setTimeout(()=>hint.classList.add('gone'), 4200); }
function fillCard(p){ document.body.dataset.fk=p.k;
  $('#cImg').src = `../cat/${p.img}.webp?v=176`; $('#cImg').alt = p.name;
  $('#cWhere').textContent = p.where; $('#cName').textContent = p.name;
  $('#cFeats').innerHTML = p.feats.map(([t,b])=>`<div class="feat"><b>${t}</b><p>${b}</p></div>`).join('');
  const i = PRODUCTS.indexOf(p); $('#cCount').textContent = `${i+1} of ${PRODUCTS.length}`;
  $('#nextName').textContent = PRODUCTS[(i+1)%PRODUCTS.length].name;
  card.querySelector('.c-body').scrollTop = 0;
}
function focus(p){
  if(state.focus===p && !state.fly) return;
  state.focus = p; document.body.classList.add('focus');
  PRODUCTS.forEach(q => q.chip.setAttribute('aria-current', String(q===p)));
  p.chip.scrollIntoView({behavior: reduceMotion?'auto':'smooth', inline:'center', block:'nearest'});
  fillCard(p); card.classList.remove('away');
  $('#back').hidden = false;
  const pose = focusPose(p);
  flyTo(pose, {lim:pose.lim});
  setHint('Drag to look around · Pinch to zoom');
}
function overview(fresh){
  state.focus = null; document.body.classList.remove('focus');
  PRODUCTS.forEach(q => q.chip.setAttribute('aria-current','false'));
  card.classList.add('away'); $('#back').hidden = true;
  const cur = new THREE.Spherical().setFromVector3(camera.position.clone().sub(HOME.target));
  const pose = poseFor(HOME, fresh ? HOME.theta : THREE.MathUtils.clamp(cur.theta, HOME.lim.minA, HOME.lim.maxA));
  flyTo(pose, {lim:HOME.lim, dur:1.3, done:()=>{ state.idleAt=performance.now(); }});
}
$('#back').addEventListener('click', () => overview());
const step = d => { const i = state.focus ? PRODUCTS.indexOf(state.focus) : -1; focus(PRODUCTS[(i+d+PRODUCTS.length)%PRODUCTS.length]); };
$('#next').addEventListener('click', () => step(1));
$('#prev').addEventListener('click', () => step(-1));
addEventListener('keydown', e => {
  if(e.key==='Escape' && state.focus) overview();
  if(e.key==='ArrowRight' && state.focus) step(1);
  if(e.key==='ArrowLeft' && state.focus) step(-1);
});

/* tap a product mesh directly */
let down = null;
canvas.addEventListener('pointerdown', e => { down = {x:e.clientX, y:e.clientY, t:performance.now()}; state.idleAt = performance.now(); controls.autoRotate = false; hint.classList.add('gone'); });
canvas.addEventListener('pointerup', e => {
  if(!down) return; const moved = Math.hypot(e.clientX-down.x, e.clientY-down.y), dt = performance.now()-down.t; down = null;
  if(moved>8 || dt>350 || state.fly) return;
  const r = canvas.getBoundingClientRect();
  raycaster.setFromCamera({x:(e.clientX-r.left)/r.width*2-1, y:-(e.clientY-r.top)/r.height*2+1}, camera);
  const hits = raycaster.intersectObjects(hitMeshes, false);
  if(hits.length) focus(hits[0].object.userData.p);
});
controls.addEventListener('start', () => { state.idleAt = performance.now(); controls.autoRotate = false; });

/* ------------------------------------------------------------------ per-frame hotspots */
const ray = new THREE.Ray(), tmp = new THREE.Vector3(), hitP = new THREE.Vector3();
function updateSpots(){
  const W = innerWidth, Hh = innerHeight, cam = camera.position, shown = [];
  for(const p of PRODUCTS){
    let show = !state.fly && p!==state.focus;
    if(show && tmp.subVectors(cam, p.center).dot(p.view) < .02) show = false;
    if(show && state.focus && p.center.distanceTo(state.focus.center) > 4.5) show = false;
    if(show){
      ray.origin.copy(cam); ray.direction.copy(p.anchor).sub(cam).normalize();
      const d = cam.distanceTo(p.anchor);
      for(const b of OCC){ if(b.containsPoint(p.anchor)) continue; if(ray.intersectBox(b, hitP) && hitP.distanceTo(cam) < d-.05){ show=false; break; } }
    }
    let x=0,y=0;
    if(show){ tmp.copy(p.anchor).project(camera); if(tmp.z>1||tmp.z<-1) show=false; x=(tmp.x+1)/2*W; y=(1-tmp.y)/2*Hh; if(x<-40||x>W+40||y<-40||y>Hh+40) show=false; }
    if(p.el.hidden === show) p.el.hidden = !show;
    if(show){ p.el.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0)`; p.el.classList.toggle('mini', !!state.focus); shown.push({p,x,y}); }
  }
  /* labels: place each on its preferred side, flip if it would collide, drop it if both sides collide */
  if(state.focus || state.fly) return;
  const rects = shown.map(s => [s.x-20, s.y-20, s.x+20, s.y+20]);
  const hit = r => rects.some(q => r[0]<q[2] && r[2]>q[0] && r[1]<q[3] && r[3]>q[1]);
  for(const s of shown.sort((a,b)=>a.y-b.y)){
    const w = s.p.lblW || (s.p.lblW = s.p.el.querySelector('.lbl').offsetWidth || 150);
    const R = [s.x+24, s.y-15, s.x+24+w, s.y+15], L = [s.x-24-w, s.y-15, s.x-24, s.y+15];
    const pref = s.p.side==='l' ? [L,'l',R,'r'] : [R,'r',L,'l'];
    let side = null;
    if(!hit(pref[0]) && pref[0][0]>4 && pref[0][2]<W-4){ side = pref[1]; rects.push(pref[0]); }
    else if(!hit(pref[2]) && pref[2][0]>4 && pref[2][2]<W-4){ side = pref[3]; rects.push(pref[2]); }
    s.p.el.classList.toggle('l', side==='l'); s.p.el.classList.toggle('nolbl', !side);
  }
}

/* keep the focused product centred in the space the detail card leaves free */
const vo = {x:0, y:0};
function updateViewOffset(dt){
  const W = innerWidth, Hh = innerHeight; let tx = 0, ty = 0;
  if(state.focus){
    if(sheetMQ.matches){ const sh = Math.min(.44*Hh, 400); ty = (112 + sh)/2 - 30; }
    else { tx = (Math.min(360, .38*W) + 18)/2; }
  }
  const k = 1 - Math.exp(-dt*5);
  vo.x += (tx-vo.x)*k; vo.y += (ty-vo.y)*k;
  if(Math.abs(vo.x)<.3 && Math.abs(vo.y)<.3 && !tx && !ty){ if(camera.view && camera.view.enabled){ camera.clearViewOffset(); } return; }
  camera.setViewOffset(W, Hh, vo.x, vo.y, W, Hh);
}

/* ------------------------------------------------------------------ loop */
function resize(){ const w=innerWidth, h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov = w/h < .8 ? 52 : 38; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const intro = poseFor({...HOME, r:44, phi:1.12}, HOME.theta+.55);
camera.position.copy(intro.pos); controls.target.copy(intro.target); camera.lookAt(intro.target);
let last = performance.now();
function frame(now){
  const dt = Math.min(.05,(now-last)/1000); last = now;
  stepFly(now);
  if(!state.fly){
    if(!state.focus && !reduceMotion && now - state.idleAt > 8000){ controls.autoRotate = true; controls.autoRotateSpeed = .35; }
    controls.update();
  }
  updateViewOffset(dt); updateSpots();
  { const fp = state.focus, want = fp ? 2.2 : 0;
    prodLight.intensity += (want - prodLight.intensity) * Math.min(1, dt*3);
    if(fp){ prodLight.position.copy(camera.position).add(new THREE.Vector3(0,.3,0)); prodLight.target.position.copy(fp.center); prodLight.target.updateMatrixWorld(); } }
  const nn = THREE.MathUtils.clamp(camera.position.distanceTo(controls.target)*.015, .02, .45);
  if(Math.abs(nn-camera.near) > .002){ camera.near = nn; camera.updateProjectionMatrix(); }
  renderer.render(scene, camera);
  if(window.__still){ window.__stillN=(window.__stillN||0)+1; }
  if(window.__paused){ window.__resume=()=>{ window.__paused=false; window.__resume=null; requestAnimationFrame(t=>{ last=t; frame(t); }); }; return; }
  requestAnimationFrame(frame);
}
/* Fast Pitch pauses the tour while it isn't on screen */
addEventListener('message',e=>{ const d=e.data; if(!d||!d.fpTourCtl) return; if(d.fpTourCtl==='pause') window.__paused=true; else if(window.__resume) window.__resume(); else window.__paused=false; });
requestAnimationFrame(t => { last=t; frame(t); });
window.__booted = true; clearTimeout(window.__failT);
Promise.all([assetsReady, ...MODEL_P]).then(() => setTimeout(() => { $('#loading').classList.add('done'); overview(true); setTimeout(()=>setHint('Drag to look around · Pinch to zoom · Tap a ring'), 1400); }, 120));

// test hooks for review
window.__tour = { focus:k=>focus(byKey[k]), overview, state, camera, controls, scene, THREE };
</script>
