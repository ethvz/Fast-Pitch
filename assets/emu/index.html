<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Smart Hub Pro 2 Emulator</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{position:fixed;inset:0;background:radial-gradient(70% 60% at 50% 46%,#1a1d1f 0%,#0b0c0d 55%,#000 100%)}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
#gl:active{cursor:grabbing}
#css{position:absolute;inset:0;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 78% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.28) 85%,rgba(0,0,0,.5) 100%)}
#hint{display:none!important}
#dim{position:absolute;inset:0;pointer-events:none;opacity:0}
#css>div,#css>div>div{pointer-events:none}
#scr{pointer-events:auto}
#glare{position:absolute;inset:0;pointer-events:none;z-index:200;mix-blend-mode:screen;opacity:.0;transition:opacity .4s}
body:not(.modes) #mode{opacity:0!important;pointer-events:none!important}
#mode{transition:opacity .4s;position:fixed;left:50%;top:196px;transform:translate(-50%,0);display:flex;padding:4px;border-radius:22px;background:rgba(20,20,22,.5);box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.08);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);z-index:5}
#mode .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:18px;background:rgba(5,229,175,.16);transition:transform .45s cubic-bezier(.22,.8,.24,1)}
#mode[data-m=table] .ind{transform:translateX(100%)}
#mode button{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 16px;min-width:146px;border:0;background:none;color:rgba(255,255,255,.72);font:500 14px -apple-system,system-ui,sans-serif;cursor:pointer;transition:color .3s;white-space:nowrap}
#mode button.on{color:#05E5AF}
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:26px;align-items:center;font:500 15px/1 -apple-system,system-ui,sans-serif;color:rgba(255,255,255,.62);letter-spacing:.01em;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#hint span{display:flex;align-items:center;gap:9px}
#hint i{width:7px;height:7px;border-radius:50%;background:#05E5AF;box-shadow:0 0 10px #05E5AF}
#front{position:fixed;left:50%;bottom:58px;transform:translate(-50%,16px);opacity:0;pointer-events:none;height:40px;padding:0 20px;border-radius:20px;border:0;background:rgba(40,40,42,.9);color:#fff;font:500 15px -apple-system,system-ui,sans-serif;display:flex;align-items:center;gap:9px;transition:opacity .35s,transform .45s cubic-bezier(.22,.8,.24,1);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);cursor:pointer}
#front.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#front svg{flex:none}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#777;font:14px -apple-system,system-ui,sans-serif;transition:opacity .6s;pointer-events:none}
#load i{width:28px;height:28px;border-radius:50%;border:2.5px solid #333;border-top-color:#05E5AF;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
body.flat #gl{display:none}
body.flat #scr{position:fixed;transform-origin:0 0;border-radius:14px;box-shadow:0 0 0 14px #0c0c0c,0 0 0 16px #e9eae8}
body.one #scr{box-shadow:none;border-radius:0}body.one #hint{display:none}
/* ===== Smart Hub Pro 2 UI — 1280×750 design canvas ===== */
@font-face{font-family:VS;src:url(../fonts/VivintSans-Regular.woff) format('woff');font-weight:400}
@font-face{font-family:VS;src:url(../fonts/VivintSans-Medium.woff) format('woff');font-weight:500}
@font-face{font-family:VS;src:url(../fonts/VivintSans-Bold.woff) format('woff');font-weight:700}
@font-face{font-family:VS;src:url(../fonts/VivintSans-Light.woff) format('woff');font-weight:300}
#scr{--mint:#3fe0b4;--or:#ff7a1a;--ease:cubic-bezier(.22,.8,.24,1);position:absolute;left:0;top:0;width:1280px;height:750px;overflow:hidden;background:#000;color:#fff;font-family:VS,-apple-system,system-ui,sans-serif;font-weight:400;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;backface-visibility:hidden;-webkit-backface-visibility:hidden;cursor:default;letter-spacing:-.005em}
#scr *{box-sizing:border-box}
:where(#scr button){font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:where(#scr svg){display:block;flex:none}
#scr .L{position:absolute;inset:0}
#scr [hidden]{display:none!important}
/* press feedback everywhere */
#scr .tap{transition:transform .18s var(--ease),filter .18s,background-color .25s,opacity .25s}
#scr .tap:active,#scr .tap.pr{transform:scale(.965);filter:brightness(1.18)}
#scr .lt .tap:active,#scr .lt .tap.pr{filter:brightness(.94)}

/* ---------- dark world ---------- */
#dk{background:#000}
#dk .bg{position:absolute;inset:0;transition:opacity .6s}
#dk .bg.g{background:radial-gradient(120% 140% at 0% 0%,#163d2e 0%,#0c1c17 38%,#050a08 62%,#000 80%)}
#dk .bg.o{background:radial-gradient(120% 140% at 0% 0%,#45200e 0%,#211009 40%,#0a0503 62%,#000 80%);opacity:0}
#dk.arm .bg.o{opacity:1}
.tabv{position:absolute;left:0;top:0;width:1280px;height:668px;opacity:0;pointer-events:none;transition:opacity .35s var(--ease),transform .45s var(--ease);transform:translateY(10px)}
.tabv.on{opacity:1;pointer-events:auto;transform:none}

/* bottom nav (dark) */
#nvD{position:absolute;left:0;right:0;bottom:0;height:82px;transition:background .4s}
#nvD .hm{position:absolute;left:22px;top:20px;width:40px;height:40px}
#nvD .sc{position:absolute;left:78px;width:988px;top:0;height:82px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-mask:linear-gradient(90deg,transparent 0,#000 22px,#000 92%,transparent 100%);mask:linear-gradient(90deg,transparent 0,#000 22px,#000 92%,transparent 100%);touch-action:pan-x}
#nvD .sc::-webkit-scrollbar{display:none}
#nvD .row{display:flex;align-items:center;height:82px;padding-left:22px;width:max-content;padding-right:40px}
#nvD .it{font-size:25px;color:#e9e9e9;margin-right:0;position:relative;height:82px;display:flex;align-items:center;white-space:nowrap}
#nvD .it.n{width:220px}
#nvD .it.n:nth-child(4){width:200px}
#nvD .it.on{color:#fff;font-weight:500}
#nvD .it.n::after{content:"";position:absolute;left:0;width:0;bottom:12px;height:2.5px;border-radius:2px;background:#fff;transition:width .35s var(--ease)}
#nvD .it.n.on::after{width:44px;left:12px}
#nvD .st{display:flex;align-items:center;gap:38px;margin-left:30px;height:82px}
#nvD .st button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff}
#nvD .dv{position:absolute;left:1065px;top:20px;width:2px;height:42px;background:#d9d9d9;border-radius:1px}
#nvD .tm{position:absolute;right:14px;top:0;height:82px;display:flex;align-items:center;font-size:25px;color:#fff}

/* home */
#hm{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x;scroll-snap-type:x proximity}
#hm::-webkit-scrollbar{display:none}
#hm .strip{position:relative;width:1930px;height:668px}
.sec{position:absolute;left:22px;top:38px;width:604px;height:604px;border-radius:24px;overflow:hidden;scroll-snap-align:start;scroll-margin-left:22px}
.sec .fill{position:absolute;inset:0;transition:opacity .7s}
.sec .fill.g{background:linear-gradient(140deg,#076448 0%,#0b5843 30%,#104636 70%,#163629 100%)}
.sec .fill.o{background:linear-gradient(140deg,#c04a18 0%,#b23f12 35%,#a03510 70%,#872a09 100%);opacity:0}
#dk.arm .sec .fill.o{opacity:1}
.sos{position:absolute;left:20px;top:20px;height:80px;padding:0 30px 0 26px;border-radius:40px;background:rgba(0,0,0,.26);display:flex;align-items:center;gap:16px;font-size:29px;font-weight:500}
.sec .gm{position:absolute;left:0;right:0;top:172px;text-align:center;font-size:29px;color:rgba(255,255,255,.72)}
.sec .stt{position:absolute;left:0;right:0;top:240px;display:flex;justify-content:center;align-items:center;gap:26px;font-size:44px;font-weight:500}
.sec .stt span{display:inline-block}
.sec .chev{position:absolute;left:254px;top:340px;width:96px;height:96px;border-radius:50%;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center}
.tl{position:absolute;width:286px;height:286px;border-radius:22px;background:#1c1c1c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);overflow:hidden}
.tl .t1{position:absolute;left:22px;top:24px;font-size:29px;color:#f4f4f4}
.tl .t2{position:absolute;left:22px;top:70px;font-size:29px;color:#8b8b8b;transition:color .3s}
.lk{position:absolute;right:22px;bottom:22px;width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .35s var(--ease),box-shadow .35s,color .35s;box-shadow:inset 0 0 0 1.5px #4b4b4b;color:#fff}
.lk.on{background:#fff;box-shadow:inset 0 0 0 1.5px #fff;color:#111}
.lk .spin{position:absolute;inset:-2px;border-radius:50%;border:3px solid transparent;border-top-color:var(--mint);opacity:0;animation:spin .8s linear infinite}
.lk.busy .spin{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.ct .im{position:absolute;left:0;top:0;width:286px;height:232px;background-size:cover;background-position:center}
.ct .nm{position:absolute;left:22px;top:24px;font-size:25px;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.ct .ft{position:absolute;left:0;right:0;bottom:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 22px;font-size:25px;color:#eee}
.th .big{position:absolute;left:20px;bottom:6px;font-size:132px;font-weight:500;letter-spacing:-.03em;line-height:1}
.th.cur .big{background:linear-gradient(180deg,#ffb58e,#f08a5d);-webkit-background-clip:text;background-clip:text;color:transparent}
.th.cool{background:linear-gradient(160deg,#55689a,#3f5285)}

/* cameras */
#cm .vae{position:absolute;right:46px;top:26px;font-size:23px;display:flex;align-items:center;gap:12px;color:#eee}
#cm .sc{position:absolute;left:0;right:0;top:110px;height:540px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x}
#cm .sc::-webkit-scrollbar{display:none}
#cm .row{display:flex;gap:32px;padding:18px 20px;width:max-content}
.cc{position:relative;height:503px;border-radius:18px;overflow:hidden;background:#1c1c1c;flex:none}
.cc .im{position:absolute;left:0;top:0;right:0;height:383px;background-size:cover;background-position:center}
.cc .n1{position:absolute;left:20px;top:405px;font-size:29px}
.cc .n2{position:absolute;left:20px;top:446px;font-size:25px;color:#a9a9a9}
.cc .cl{position:absolute;right:20px;top:420px}
.dt{position:absolute;left:24px;top:22px;height:76px;padding:0 28px 0 8px;border-radius:38px;background:rgba(40,40,40,.86);display:flex;align-items:center;gap:14px;font-size:30px}
.dt .bn{width:60px;height:60px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;transition:background .3s,color .3s}
.dt.on .bn{background:var(--mint)}

/* thermostat */
#tm{transition:background .5s}
#tm{background:#00479a}
#tm.heat{background:#b4471a}#tm.off{background:#2c2c2e}#tm.auto{background:#33507a}
#tm .l{position:absolute;left:0;width:647px;top:0;height:668px;text-align:center}
#tm .h1{position:absolute;left:0;right:0;top:198px;font-size:65px;font-weight:500}
#tm .h2{position:absolute;left:0;right:0;top:308px;font-size:44px;display:flex;justify-content:center;align-items:center;gap:14px}
#tm .pl{position:absolute;top:425px;width:284px;height:84px;border-radius:42px;background:#fff;color:#0a4aa0;font-size:31px;display:flex;align-items:center;justify-content:center;gap:12px;transition:color .4s}
#tm.heat .pl{color:#b4471a}#tm.off .pl{color:#2c2c2e}#tm.auto .pl{color:#33507a}
#tm .dvd{position:absolute;left:646px;top:152px;width:2px;height:420px;background:rgba(255,255,255,.22)}
#tm .r{position:absolute;left:648px;right:0;top:0;height:668px}
#tm .ar{position:absolute;left:50%;width:120px;height:100px;margin-left:-60px;display:flex;align-items:center;justify-content:center}
#tm .spv{position:absolute;left:0;right:0;top:262px;text-align:center;font-size:170px;font-weight:500;line-height:1;letter-spacing:-.02em}
#tm .spv sup{position:absolute;font-size:46px;margin-left:8px;top:6px}
#tm .ic{position:absolute;bottom:14px;display:flex;gap:46px;right:44px}
#tm .ic button{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
#tm .num{display:inline-block;transition:transform .25s var(--ease),opacity .25s}

/* lights */
#lt .hd{position:absolute;left:36px;top:34px;font-size:34px;font-weight:500}
#lt .gr{position:absolute;left:36px;top:104px;right:36px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.lc{height:250px;border-radius:22px;background:#1c1c1c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);position:relative;overflow:hidden;transition:background .4s}
.lc.on{background:linear-gradient(160deg,#3a3320,#24211a)}
.lc .n{position:absolute;left:24px;top:24px;font-size:29px}
.lc .s{position:absolute;left:24px;top:68px;font-size:25px;color:#8b8b8b}
.lc.on .s{color:#ffd77a}
.lc .bl{position:absolute;right:22px;top:22px;width:84px;height:84px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #4b4b4b;display:flex;align-items:center;justify-content:center;transition:all .35s}
.lc.on .bl{background:#ffd15c;color:#2a2210;box-shadow:0 0 40px rgba(255,209,92,.45)}
.lc .dim{position:absolute;left:24px;right:24px;bottom:30px;height:46px;border-radius:23px;background:#2c2c2c;overflow:hidden;touch-action:none}
.lc .dim i{position:absolute;left:0;top:0;bottom:0;background:#4a4a4a;border-radius:23px;transition:background .35s}
.lc.on .dim i{background:linear-gradient(90deg,#c89c3a,#ffd15c)}

/* overlays (dark) */
.ov{position:absolute;inset:0;z-index:10;opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.ov.on{opacity:1;pointer-events:auto}
#arm .bgx{position:absolute;inset:0;opacity:.93;background:radial-gradient(110% 130% at 0% 10%,#1a4a37 0%,#0f2a20 34%,#070e0b 60%,#000 82%);transition:opacity .6s}
#arm .bgx.o{background:radial-gradient(110% 130% at 0% 10%,#8a2c09 0%,#5a1d08 32%,#2a1004 58%,#0b0601 82%);opacity:0}
#arm.arm .bgx.o{opacity:.93}
#arm .opt{position:absolute;left:1093px;top:17px;height:83px;padding:0 34px;border-radius:42px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.75);font-size:35px;display:flex;align-items:center}
.ap{position:absolute;left:27px;width:576px;height:134px;border-radius:67px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);display:flex;align-items:center;padding-left:44px;gap:30px;text-align:left;transition:background .45s var(--ease),transform .5s var(--ease),opacity .4s}
.ap .tx b{display:block;font-weight:400;font-size:37px;line-height:1.15}
.ap .tx small{display:block;font-size:31px;color:rgba(255,255,255,.75);line-height:1.2}
.ap.cur.g{background:#1e5c46}
.ap.cur.o{background:#c34719}
#arm .ap{transform:translateX(-30px);opacity:0}
#arm.on .ap{transform:none;opacity:1}
#arm.on .ap:nth-of-type(2){transition-delay:.04s}#arm.on .ap:nth-of-type(3){transition-delay:.08s}
#arm .cnt{position:absolute;left:660px;right:60px;top:250px;text-align:center;font-size:30px;color:rgba(255,255,255,.75);opacity:0;transition:opacity .4s}
#arm .cnt b{display:block;font-size:120px;font-weight:500;color:#fff;line-height:1.1}
#arm.cd .cnt{opacity:1}

#sopt .dim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#sopt .pn{position:absolute;left:427px;top:0;right:0;bottom:0;background:#1c1c1c;transform:translateX(100%);transition:transform .45s var(--ease)}
#sopt.on .pn{transform:none}
#sopt .x{position:absolute;right:14px;top:12px;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
#sopt h3{position:absolute;left:82px;top:144px;margin:0;font-size:45px;font-weight:500}
.so{position:absolute;left:82px;height:85px;padding:0 40px 0 34px;border-radius:43px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.75);display:flex;align-items:center;gap:24px;font-size:33px;transition:background .3s,color .3s}
.so.on{background:#fff;color:#111}
.socap{position:absolute;left:82px;font-size:25px;color:#e0e0e0}

#sos{background:#000}
#sos .bk{position:absolute;left:12px;top:12px;height:52px;padding:0 14px;display:flex;align-items:center;gap:16px;font-size:29px}
#sos h2{position:absolute;left:27px;top:224px;width:560px;margin:0;font-size:46px;font-weight:500;line-height:1.27}
#sos p{position:absolute;left:27px;top:448px;width:560px;margin:0;font-size:29px;line-height:1.36;color:#e6e6e6}
.sp{position:absolute;left:689px;width:575px;height:143px;border-radius:72px;background:#1d1d1d;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);display:flex;align-items:center;gap:30px;padding-left:30px;text-align:left;overflow:hidden}
.sp .ci{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.sp .tx{position:relative;z-index:1}
.sp .tx b{display:block;font-weight:500;font-size:36px}
.sp .tx small{display:block;font-size:30px;color:#e2e2e2}
.sp .pg{position:absolute;left:0;top:0;bottom:0;width:0;opacity:.28}
.sp.hold .pg{width:100%;transition:width 3s linear}
#sos .ah{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;pointer-events:none;transition:opacity .4s;background:#000}
#sos.fired .ah{opacity:1;pointer-events:auto}
#sos .ah .ring{width:180px;height:180px;border-radius:50%;display:flex;align-items:center;justify-content:center;animation:pulse 1.4s ease-out infinite}
#sos .ah h4{margin:40px 0 10px;font-size:48px;font-weight:500}
#sos .ah div{font-size:29px;color:#cfcfcf}
#sos .ah button{margin-top:44px;height:84px;padding:0 54px;border-radius:42px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.8);font-size:32px}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--pc)}100%{box-shadow:0 0 0 70px transparent}}

#live{background:#000}
#live .im{position:absolute;left:0;top:0;width:1109px;height:750px;background-size:cover;background-position:center;animation:drift 18s ease-in-out infinite alternate}
#live .im.por{background-size:contain;background-repeat:no-repeat}
@keyframes drift{from{transform:scale(1.0)}to{transform:scale(1.035) translate(-6px,4px)}}
#live .mask{position:absolute;left:0;top:0;width:1109px;height:750px;overflow:hidden}
#live .lv{position:absolute;left:0;width:1109px;top:28px;display:flex;justify-content:center;align-items:center;gap:14px;font-size:33px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
#live .lv i{width:24px;height:24px;border-radius:50%;background:#e8431f;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
#live .rl{position:absolute;left:1109px;top:0;right:0;bottom:0;background:#151a1c;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:18px 0}
.rb{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:26px;color:#fff}
.rb .c{width:104px;height:104px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;transition:background .3s,color .3s,box-shadow .3s}
.rb.on .c{background:#fff;color:#111;box-shadow:inset 0 0 0 2px #fff}
.rb.talk.on .c{background:var(--mint);box-shadow:0 0 0 10px rgba(63,224,180,.18)}
.rb.lite.on .c{background:#ffd15c;color:#2a2210;box-shadow:0 0 30px rgba(255,209,92,.5)}
#live .edge{position:absolute;left:0;top:0;width:44px;height:750px;display:flex;align-items:center}

/* sliders + dimmers + SOS hold use pointer tracking in screen space */
let drag=null;
function onDown(e){
  const t=e.target;
  const tp=t.closest('.tap'); if(tp){ tp.classList.add('pr'); const up=()=>{ tp.classList.remove('pr'); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up); }; window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up); }
  const sl=t.closest('[data-sl]'); if(sl){ drag={sl}; moveSl(e); e.preventDefault(); return; }
  const dm=t.closest('[data-dim]'); if(dm){ drag={dm}; moveSl(e); e.preventDefault(); return; }
  const h=t.closest('[data-hold]'); if(h){ h.classList.add('hold'); holdT=setTimeout(()=>{ h.classList.remove('hold'); sosFire(h.dataset.hold); },3000); const end=()=>{ clearTimeout(holdT); h.classList.remove('hold'); window.removeEventListener('pointerup',end); window.removeEventListener('pointercancel',end); }; window.addEventListener('pointerup',end); window.addEventListener('pointercancel',end); e.preventDefault(); return; }
  const hs=t.closest('.hsc'); if(hs && e.pointerType==='mouse'){ const p=UI.loc(e); drag={hs, x0:p.x, y0:p.y, s0:hs.scrollLeft, t0:hs.scrollTop, moved:false}; }
}
function moveSl(e){ const p=UI.loc(e); if(!p) return;
  if(drag.sl){ const r=localRect(drag.sl); setSl(drag.sl,(p.x-r.x)/r.w*100); }
  if(drag.dm){ const r=localRect(drag.dm); const k=drag.dm.dataset.dim; const v=Math.round(Math.max(5,Math.min(100,(p.x-r.x)/r.w*100))); S.lights[k].b=v; S.lights[k].on=true; renderLights(); } }
function onMove(e){ if(!drag) return; if(drag.sl||drag.dm){ moveSl(e); return; }
  if(drag.hs){ const p=UI.loc(e); if(!p) return; const dx=p.x-drag.x0, dy=p.y-drag.y0; if(Math.abs(dx)+Math.abs(dy)>6) drag.moved=true; drag.hs.scrollLeft=drag.s0-dx; drag.hs.scrollTop=drag.t0-dy; } }
function onUp(){ if(drag&&drag.hs&&drag.moved){ const cap=ev=>{ ev.stopPropagation(); ev.preventDefault(); }; window.addEventListener('click',cap,{capture:true,once:true}); setTimeout(()=>window.removeEventListener('click',cap,{capture:true}),50); } drag=null; }
